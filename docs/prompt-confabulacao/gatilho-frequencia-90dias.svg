<svg class="dia" viewBox="0 0 780 300" role="img" aria-label="Quantas vezes o gatilho da indicação dispara dentro de um ciclo de 90 dias">
  <style>
    .eixo{font-size:11px;fill:var(--cinza);font-family:"IBM Plex Sans",sans-serif}
    .rotulo-linha{font-size:13px;font-weight:600;fill:var(--tinta);font-family:"IBM Plex Sans",sans-serif}
    .marco{font-size:11.5px;font-weight:600;font-family:"IBM Plex Sans",sans-serif}
  </style>
  <line x1="40" y1="250" x2="740" y2="250" stroke="var(--cinza)" stroke-width="1.4"/><line x1="40.0" y1="250" x2="40.0" y2="256" stroke="var(--cinza)" stroke-width="1.4"/><text x="40.0" y="272" text-anchor="middle" class="eixo">dia 0</text><line x1="195.6" y1="250" x2="195.6" y2="256" stroke="var(--cinza)" stroke-width="1.4"/><text x="195.6" y="272" text-anchor="middle" class="eixo">dia 20</text><line x1="351.1" y1="250" x2="351.1" y2="256" stroke="var(--cinza)" stroke-width="1.4"/><text x="351.1" y="272" text-anchor="middle" class="eixo">dia 40</text><line x1="506.7" y1="250" x2="506.7" y2="256" stroke="var(--cinza)" stroke-width="1.4"/><text x="506.7" y="272" text-anchor="middle" class="eixo">dia 60</text><line x1="662.2" y1="250" x2="662.2" y2="256" stroke="var(--cinza)" stroke-width="1.4"/><text x="662.2" y="272" text-anchor="middle" class="eixo">dia 80</text><line x1="740.0" y1="250" x2="740.0" y2="256" stroke="var(--cinza)" stroke-width="1.4"/><text x="740.0" y="272" text-anchor="middle" class="eixo">dia 90</text><text x="390.0" y="292" text-anchor="middle" class="eixo" style="font-weight:600">um ciclo de 90 dias, o que o gráfico anterior trata como uma unidade só</text><text x="40" y="56" class="rotulo-linha">Modelo desta página</text><line x1="40" y1="70" x2="740" y2="70" stroke="var(--linha)" stroke-width="1.4" stroke-dasharray="3 4"/><circle cx="740.0" cy="70" r="8" fill="var(--azul)"/><text x="740.0" y="54" text-anchor="end" class="marco" style="fill:var(--azul)">1 convite processado</text><text x="40" y="136" class="rotulo-linha">Na prática, médico a 150 consultas/mês</text><line x1="40" y1="150" x2="740" y2="150" stroke="var(--linha)" stroke-width="1.4" stroke-dasharray="3 4"/><circle cx="195.6" cy="150" r="8" fill="var(--vermelho)"/><circle cx="351.1" cy="150" r="8" fill="var(--vermelho)"/><circle cx="506.7" cy="150" r="8" fill="var(--vermelho)"/><circle cx="662.2" cy="150" r="8" fill="var(--vermelho)"/><text x="428.9" y="134" text-anchor="middle" class="marco" style="fill:var(--vermelho)">4 convites processados no mesmo ciclo</text>
</svg>